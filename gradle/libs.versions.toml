[versions]
agp = "8.13.2"
spotbugsPlugin = "6.4.8"
spotbugs = "4.7.3"
navigation = "2.9.6"
appcompat = "1.7.1"
preference = "1.2.1"
material = "1.13.0"
jackson = "2.20.1"
commonsCodec = "1.20.0"
commonsIo = "2.21.0"
commonsValidator = "1.10.1"
junit = "4.13.2"
hamcrest = "1.3"
mockito = "5.21.0"
mockitoAll = "1.10.19"
dexmaker = "2.28.6"
sqlite4java = "1.0.392"
sqlcipher = "4.12.0"
sqlite = "2.6.2"
okhttp = "3.13.1"
toxiproxy = "2.1.11"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPlugin" }
navigationSafeargs = { id = "androidx.navigation.safeargs", version.ref = "navigation" }

[libraries]
androidGradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
spotbugsGradlePlugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugsPlugin" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
navigationFragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
navigationUi = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
material = { module = "com.google.android.material:material", version.ref = "material" }
jacksonDatabind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
commonsCodec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }
commonsIo = { module = "commons-io:commons-io", version.ref = "commonsIo" }
commonsValidator = { module = "commons-validator:commons-validator", version.ref = "commonsValidator" }
junit = { module = "junit:junit", version.ref = "junit" }
hamcrestAll = { module = "org.hamcrest:hamcrest-all", version.ref = "hamcrest" }
hamcrestCore = { module = "org.hamcrest:hamcrest-core", version.ref = "hamcrest" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockitoAll = { module = "org.mockito:mockito-all", version.ref = "mockitoAll" }
dexmakerMockitoInline = { module = "com.linkedin.dexmaker:dexmaker-mockito-inline", version.ref = "dexmaker" }
sqlite4java = { module = "com.almworks.sqlite4java:sqlite4java", version.ref = "sqlite4java" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
okhttpUrlconnection = { module = "com.squareup.okhttp3:okhttp-urlconnection", version.ref = "okhttp" }
toxiproxy = { module = "eu.rekawek.toxiproxy:toxiproxy-java", version.ref = "toxiproxy" }
androidxTestJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidxTestRunner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
